<!-- @dsCard group="TV (10-foot)" viewport="1280x720" name="Android TV app" subtitle="Browse · show/season/episode detail · movie detail · player — D-pad focus (arrow keys)" -->
<!-- @startingPoint section="SpatialFin screens" subtitle="Android TV (10-foot) Jellyfin client — browse, detail, player" viewport="1280x720" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SpatialFin — Android TV</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #000; font-family: var(--font-sans); }
  #root { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  [data-row]::-webkit-scrollbar { display: none; }
  /* TV focus ring for design-system buttons (cards/tabs manage their own) */
  [data-focusable]:focus { outline: 3px solid var(--primary); outline-offset: 3px; }
  [data-focusable] { transition: outline-color var(--duration-fast) var(--ease-standard); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="../beam/data.js"></script>
  <script src="data.js"></script>
  <script src="tvFocus.js"></script>
  <script type="text/babel" src="TvHomeScreen.jsx"></script>
  <script type="text/babel" src="TvSearchScreen.jsx"></script>
  <script type="text/babel" src="TvLibraryScreen.jsx"></script>
  <script type="text/babel" src="TvSourceBrowseScreen.jsx"></script>
  <script type="text/babel" src="TvOverflowSheet.jsx"></script>
  <script type="text/babel" src="ShowDetailScreen.jsx"></script>
  <script type="text/babel" src="MovieDetailScreen.jsx"></script>
  <script type="text/babel" src="TvPlayerScreen.jsx"></script>
  <script type="text/babel" src="TvNowPlayingScreen.jsx"></script>
  <script type="text/babel" src="TvShell.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById("root")).render(<window.TvShell />);
    setTimeout(() => window.__tvFocusInit && window.__tvFocusInit(), 400);
  </script>
</body>
</html>
