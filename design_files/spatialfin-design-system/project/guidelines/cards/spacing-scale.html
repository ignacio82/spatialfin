<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="Fixed 4 / 8 / 16 / 24 / 32 / 64 — never invent values between tiers" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-app); padding: 22px; box-sizing: border-box; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .bar { background: var(--accent); border-radius: 3px; height: 18px; }
  .lbl { color: var(--text-primary); font-size: 12px; font-weight: 500; }
  .px { color: var(--text-secondary); font-family: var(--font-mono); font-size: 10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="width: var(--space-xs);"></div><span class="lbl">xs</span><span class="px">4</span></div>
    <div class="item"><div class="bar" style="width: var(--space-sm);"></div><span class="lbl">sm</span><span class="px">8</span></div>
    <div class="item"><div class="bar" style="width: var(--space-md);"></div><span class="lbl">md</span><span class="px">16</span></div>
    <div class="item"><div class="bar" style="width: var(--space-lg);"></div><span class="lbl">lg · default</span><span class="px">24</span></div>
    <div class="item"><div class="bar" style="width: var(--space-xl);"></div><span class="lbl">xl</span><span class="px">32</span></div>
    <div class="item"><div class="bar" style="width: var(--space-2xl);"></div><span class="lbl">2xl</span><span class="px">64</span></div>
  </div>
</body>
</html>
