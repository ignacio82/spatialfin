<!-- @dsCard group="Colors" viewport="700x150" name="Light scheme" subtitle="Phone (Beam) in system light mode — same calming blue, inverted" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 0; }
  .frame { background: var(--surface-app); padding: 20px; box-sizing: border-box; min-height: 150px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { width: 158px; height: 88px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; border: 1px solid var(--outline-variant); }
  .lbl { font-size: 12px; font-weight: 500; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
</style>
</head>
<body class="theme-light">
  <div class="frame">
    <div class="row">
      <div class="sw" style="background: var(--primary);"><span class="lbl" style="color: var(--on-primary);">Primary</span><span class="hex" style="color: var(--on-primary);">#3A608F</span></div>
      <div class="sw" style="background: var(--primary-container);"><span class="lbl" style="color: var(--on-primary-container);">Primary container</span><span class="hex" style="color: var(--on-primary-container);">#D3E3FF</span></div>
      <div class="sw" style="background: var(--surface);"><span class="lbl" style="color: var(--on-surface);">Surface</span><span class="hex" style="color: var(--on-surface-variant);">#F8F9FF</span></div>
      <div class="sw" style="background: var(--surface-container-high);"><span class="lbl" style="color: var(--on-surface);">Container high</span><span class="hex" style="color: var(--on-surface-variant);">#E7E8EE</span></div>
    </div>
  </div>
</body>
</html>
