<!-- @dsCard group="Type" viewport="700x250" name="Title, Body & Label" subtitle="Card titles (medium 500), metadata body, chip/badge labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-app); padding: 22px; box-sizing: border-box; color: var(--text-primary); }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); width: 120px; flex-shrink: 0; }
  .sub { color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="spec"><span class="tag">title-large 22</span><span class="m3-title-large">Suggestions</span></div>
  <div class="spec"><span class="tag">title-medium 16</span><span class="m3-title-medium">Spring · Movie</span></div>
  <div class="spec"><span class="tag">body-large 16</span><span class="m3-body-large">Two strange characters explore a capricious, infinite machine.</span></div>
  <div class="spec"><span class="tag">body-small 12</span><span class="m3-body-small sub">2006 · 10 min · NR · 26% watched</span></div>
  <div class="spec"><span class="tag">label-large 14</span><span class="m3-label-large" style="color: var(--accent);">PLAY</span></div>
  <div class="spec"><span class="tag">label-small 11</span><span class="m3-label-small sub" style="letter-spacing:.5px;">4K · HDR · 5.1</span></div>
</body>
</html>
