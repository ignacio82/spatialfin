<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces — Dark elevation" subtitle="M3 tonal surface tiers, dark scheme. App background → highest container" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-app); padding: 20px; box-sizing: border-box; }
  .strip { display: flex; border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border); }
  .cell { flex: 1; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; gap: 2px; }
  .lbl { color: var(--text-primary); font-size: 11px; font-weight: 500; }
  .hex { color: var(--text-secondary); font-family: var(--font-mono); font-size: 10px; }
</style>
</head>
<body>
  <div class="strip">
    <div class="cell" style="background: var(--surface-container-lowest);"><span class="lbl">lowest</span><span class="hex">#0C0E13</span></div>
    <div class="cell" style="background: var(--surface-container-low);"><span class="lbl">low</span><span class="hex">#191C20</span></div>
    <div class="cell" style="background: var(--surface-container);"><span class="lbl">container</span><span class="hex">#1D2024</span></div>
    <div class="cell" style="background: var(--surface-container-high);"><span class="lbl">high</span><span class="hex">#272A2F</span></div>
    <div class="cell" style="background: var(--surface-container-highest);"><span class="lbl">highest</span><span class="hex">#32353A</span></div>
    <div class="cell" style="background: var(--surface-bright);"><span class="lbl">bright</span><span class="hex">#37393E</span></div>
  </div>
</body>
</html>
