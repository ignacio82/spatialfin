<body>
  <div id="root"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, IconButton, Pill, Badge } = window.SpatialFinDesignSystem_0d3fe7;
    function Demo() {
      return (
        <div>
          <div className="group"><span className="cap">Button — emphasis</span>
            <Button variant="filled" icon="play" size="lg">Play</Button>
            <Button variant="tonal" icon="download">Download</Button>
            <Button variant="outlined" icon="heart">Add Favorite</Button>
            <Button variant="text">Details</Button>
            <Button variant="glass" icon="cast">Cast</Button>
          </div>
          <div className="group"><span className="cap">Sizes & disabled</span>
            <Button variant="filled" size="sm">Small</Button>
            <Button variant="filled" size="md">Medium</Button>
            <Button variant="filled" size="lg">Large</Button>
            <Button variant="filled" disabled>Disabled</Button>
          </div>
          <div className="group"><span className="cap">IconButton</span>
            <IconButton icon="mic" variant="glass" label="Voice" size="lg" />
            <IconButton icon="settings" variant="tonal" label="Settings" />
            <IconButton icon="cast" variant="filled" label="Cast" />
            <IconButton icon="x" variant="ghost" label="Close" />

          <div className="group"><span className="cap">Pills & badges</span>

            <Pill tone="accent">4K</Pill>
            <Pill tone="outline">HDR</Pill>
            <Badge tone="overlay">4K</Badge>
            <Badge tone="accent" icon="download" />
            <Badge tone="success">Downloaded</Badge>

        </div>
      );

    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
