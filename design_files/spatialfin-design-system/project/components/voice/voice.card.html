<!-- @dsCard group="Components" viewport="700x260" name="Voice assistant" subtitle="Mic FAB + cross-surface feedback states (listening · thinking · answered · error)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-app); padding: 26px; box-sizing: border-box; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 20px; align-items: center; }
  .cap { color: var(--text-secondary); font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { VoiceFab, VoiceFeedback } = window.SpatialFinDesignSystem_0d3fe7;
    function Demo() {
      return (
        <div className="col">
          <div className="row">
            <div className="col" style={{alignItems:'center'}}><span className="cap">idle</span><VoiceFab state="idle" /></div>
            <div className="col" style={{alignItems:'center'}}><span className="cap">listening</span><VoiceFab state="listening" /></div>
            <div className="col" style={{alignItems:'center'}}><span className="cap">processing</span><VoiceFab state="processing" /></div>
          </div>
          <VoiceFeedback state="listening" text="“play something funny under 90 minutes”" />
          <VoiceFeedback state="processing" />
          <VoiceFeedback state="answered" text="Starting Big Buck Bunny." />
          <VoiceFeedback state="error" />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
