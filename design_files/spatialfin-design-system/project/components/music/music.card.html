<!-- @dsCard group="Components" viewport="700x260" name="Music — Mini player & SendSpin picker" subtitle="MaMiniPlayer (Preparing → Playing → Stop) + MaPlayerPickerSheet inline preview" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-app); padding: 22px; box-sizing: border-box; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .cap { color: var(--text-secondary); font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .6px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const NS = window.SpatialFinDesignSystem_0d3fe7 || {};
    function Demo() {
      const { MaMiniPlayer } = NS;
      if (!MaMiniPlayer) return <div style={{color:'var(--text-secondary)'}}>MaMiniPlayer will appear in the next bundle build.</div>;
      const t = { title: "Midnight City", artist: "M83 · Hurry Up, We're Dreaming", artwork: "../../assets/music/album-cyan.png" };
      return (
        <div className="stack">
          <span className="cap">Preparing</span>
          <MaMiniPlayer track={t} phase="preparing" selectedPlayer="Living Room" />
          <span className="cap">Playing</span>
          <MaMiniPlayer track={t} phase="playing" selectedPlayer="Living Room" />
          <span className="cap">Paused</span>
          <MaMiniPlayer track={{...t, artwork:'../../assets/music/album-amber.png'}} phase="paused" selectedPlayer="Kitchen + 1 more" />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
