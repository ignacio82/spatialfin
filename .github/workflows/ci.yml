name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: spatialfin-webxr

    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: spatialfin-webxr/package-lock.json

    - name: Install web dependencies
      run: npm ci

    - name: Build and run WebXR browser integration tests
      run: npm run verify

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Run the two Play bundles in separate, single-worker Gradle processes. R8 and
    # Kotlin otherwise retain independent 8 GiB heaps from gradle.properties,
    # which exceeds the memory budget of a hosted runner under load. Keep this as
    # the first Gradle step so no default 8 GiB daemon is resident alongside it.
    - name: Build optimized Play bundles (serialized)
      env:
        # Shrinker failures are deterministic; retrying a full optimized build
        # only repeats the most memory-intensive CI step.
        GRADLE_RETRY_ATTEMPTS: "1"
      run: |
        common_gradle_args=(
          --no-daemon
          --no-parallel
          --max-workers=1
          "-Dorg.gradle.jvmargs=-Xmx5120m -Dfile.encoding=UTF-8 -Dcom.android.tools.r8.enableKeepAnnotations=true"
          -Pkotlin.compiler.execution.strategy=in-process
        )
        bash .github/scripts/run-gradle-with-retry.sh \
          "${common_gradle_args[@]}" \
          :app:unified:bundleLibreRelease
        bash .github/scripts/run-gradle-with-retry.sh \
          "${common_gradle_args[@]}" \
          :app:unified:bundleTvRelease

    - name: Assemble shipped debug variants
      run: bash .github/scripts/run-gradle-with-retry.sh :app:unified:assembleLibreDebug :app:unified:assembleTvDebug

    - name: Run debug unit tests
      run: |
        bash .github/scripts/run-gradle-with-retry.sh \
          :app:unified:testLibreDebugUnitTest \
          :app:unified:testTvDebugUnitTest \
          :core:testLibreDebugUnitTest \
          :data:testDebugUnitTest \
          :fcast:testDebugUnitTest \
          :modes:film:testDebugUnitTest \
          :player:beam:testDebugUnitTest \
          :player:core:testDebugUnitTest \
          :player:local:testDebugUnitTest \
          :player:session:testDebugUnitTest \
          :player:tv:testDebugUnitTest \
          :player:xr:testDebugUnitTest \
          :settings:testDebugUnitTest \
          :setup:testDebugUnitTest

    - name: Android Lint (gated on new issues via committed baseline)
      run: bash .github/scripts/run-gradle-with-retry.sh :app:unified:lintLibreDebug

    # Deprecated APIs otherwise pile up invisibly behind a green build — 39 Jetpack
    # XR ones did exactly that. Fails only on a *new* kind of deprecation.
    - name: Deprecation baseline (fails on newly introduced deprecated APIs)
      run: bash .github/scripts/check-deprecations.sh

    # Advisory only (non-blocking). The compose-stability-analyzer gate fails on
    # ANY baseline diff — new composables and added parameters included, not just
    # genuine stability regressions — so a blocking gate breaks routine feature
    # pushes. We still run it and print the diff so regressions stay visible;
    # when a change is intentional, refresh the baselines with
    # `./gradlew stabilityDump` and commit them. GRADLE_RETRY_ATTEMPTS=1 because a
    # baseline diff is deterministic — retrying it just wastes CI time.
    - name: Check Compose stability baselines (advisory, non-blocking)
      continue-on-error: true
      env:
        GRADLE_RETRY_ATTEMPTS: "1"
      run: |
        bash .github/scripts/run-gradle-with-retry.sh \
          :app:unified:libreDebugStabilityCheck \
          :app:unified:tvDebugStabilityCheck \
          :core:libreDebugStabilityCheck \
          :fcast:debugStabilityCheck \
          :modes:film:debugStabilityCheck \
          :player:beam:debugStabilityCheck \
          :player:session:debugStabilityCheck \
          :player:tv:debugStabilityCheck \
          :player:xr:debugStabilityCheck
